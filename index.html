<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="description" content="Lecteur IPTV moderne style iSTB pour Android, Smart TV et Tablettes avec support Stalker MAC, Xtream et M3U." />

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <meta property="og:title" content="iSTB IPTV Player Pro" />

    <meta property="og:type" content="website" />

  <body class="bg-[#020617] text-slate-100 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
